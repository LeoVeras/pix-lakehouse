# Databricks Asset Bundle
# Os jobs passam a ser descritos aqui, não criados pela interface.
# Nomenclatura de ambientes espelhando o fluxo da esteira: DSV e PRD.

bundle:
  name: pix-lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Catálogo Unity Catalog
    default: dbw_leo_estudo_2
  schema:
    description: Schema do ambiente
    default: contas_digitais_dsv

targets:
  # DSV — ambiente de desenvolvimento. Deploy automático após o merge.
  dsv:
    mode: development
    default: true
    workspace:
      host: https://adb-SEU-ID.azuredatabricks.net
    variables:
      schema: contas_digitais_dsv

  # PRD — produção. Só recebe deploy após aprovação (a GMUD).
  prd:
    mode: production
    workspace:
      host: https://adb-SEU-ID.azuredatabricks.net
      root_path: /Shared/.bundle/prd/${bundle.name}
    variables:
      schema: contas_digitais_prd
