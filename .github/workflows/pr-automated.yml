# PR AUTOMATED — validações antes do merge.
# Espelha a etapa de mesmo nome da esteira: SonarQube + Security Gate
# rodando em paralelo. Se qualquer um reprovar, a PR não avança.

name: PR Automated

on:
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # SONARQUBE — análise de qualidade do código
  # ─────────────────────────────────────────────
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # clone completo: o Sonar precisa do histórico para saber
          # o que é "new code" e o que é legado
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─────────────────────────────────────────────
  # SECURITY GATE — barreira de segurança
  # ─────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A regra que isso protege: credencial nunca entra no repositório.
      # Token vazado em commit continua no histórico mesmo depois de removido.
      - name: Procurar segredos hardcoded
        run: |
          if grep -rEn "(dapi[a-f0-9]{32}|password\s*=\s*['\"]|token\s*=\s*['\"][a-zA-Z0-9]{20})" src/ resources/ 2>/dev/null; then
            echo "::error::Possível segredo encontrado no código"
            exit 1
          fi
          echo "Nenhum segredo detectado"

  # ─────────────────────────────────────────────
  # BUNDLE — valida a definição dos jobs
  # ─────────────────────────────────────────────
  validate-bundle:
    name: Validar bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      # Confere sintaxe e referências sem publicar nada em lugar nenhum.
      - name: databricks bundle validate
        run: databricks bundle validate -t dsv
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
